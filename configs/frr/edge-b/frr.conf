frr defaults traditional
hostname edge-b
service integrated-vtysh-config
log stdout informational
!
ip prefix-list CLIENT seq 10 permit 10.111.1.0/24
ip prefix-list SERVER seq 10 permit 10.112.1.0/24
!
route-map TRANSIT-IN permit 10
 match ip address prefix-list CLIENT
 set local-preference 200
route-map TRANSIT-IN permit 20
!
route-map DIRECT-IN permit 10
 match ip address prefix-list CLIENT
 set local-preference 100
route-map DIRECT-IN permit 20
!
route-map SERVER-OUT permit 10
 match ip address prefix-list SERVER
!
route-map DIRECT-OUT permit 10
 match ip address prefix-list SERVER
!
router bgp 65020
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 172.16.20.3 remote-as 65000
 neighbor 172.16.20.3 timers 3 9
 neighbor 172.16.12.2 remote-as 65010
 neighbor 172.16.12.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.112.1.0/24
  neighbor 172.16.20.3 route-map TRANSIT-IN in
  neighbor 172.16.20.3 route-map SERVER-OUT out
  neighbor 172.16.12.2 route-map DIRECT-IN in
  neighbor 172.16.12.2 route-map DIRECT-OUT out
  redistribute connected route-map SERVER-OUT
 exit-address-family
!
line vty
!
