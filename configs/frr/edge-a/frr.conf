frr defaults traditional
hostname edge-a
service integrated-vtysh-config
log stdout informational
!
ip prefix-list CLIENT seq 10 permit 10.111.1.0/24
ip prefix-list SERVER seq 10 permit 10.112.1.0/24
!
route-map TRANSIT-IN permit 10
 match ip address prefix-list SERVER
 set local-preference 200
route-map TRANSIT-IN permit 20
!
route-map DIRECT-IN permit 10
 match ip address prefix-list SERVER
 set local-preference 100
route-map DIRECT-IN permit 20
!
route-map CLIENT-OUT permit 10
 match ip address prefix-list CLIENT
!
router bgp 65010
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 172.16.10.3 remote-as 65000
 neighbor 172.16.12.3 remote-as 65020
 !
 address-family ipv4 unicast
  network 10.111.1.0/24
  neighbor 172.16.10.3 route-map TRANSIT-IN in
  neighbor 172.16.10.3 route-map CLIENT-OUT out
  neighbor 172.16.12.3 route-map DIRECT-IN in
  neighbor 172.16.12.3 route-map CLIENT-OUT out
  redistribute connected route-map CLIENT-OUT
 exit-address-family
!
line vty
!
