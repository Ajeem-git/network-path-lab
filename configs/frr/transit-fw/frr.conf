frr defaults traditional
hostname transit-fw
service integrated-vtysh-config
log stdout informational
!
ip prefix-list CLIENT seq 10 permit 10.111.1.0/24
ip prefix-list SERVER seq 10 permit 10.112.1.0/24
!
route-map TO-EDGE-A permit 10
 match ip address prefix-list SERVER
route-map TO-EDGE-B permit 10
 match ip address prefix-list CLIENT
!
router bgp 65000
 bgp router-id 10.255.0.254
 no bgp ebgp-requires-policy
 neighbor 172.16.10.2 remote-as 65010
 neighbor 172.16.10.2 timers 3 9
 neighbor 172.16.20.2 remote-as 65020
 neighbor 172.16.20.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 172.16.10.2 route-map TO-EDGE-A out
  neighbor 172.16.20.2 route-map TO-EDGE-B out
 exit-address-family
!
line vty
!
