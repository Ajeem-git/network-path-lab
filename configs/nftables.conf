flush ruleset

table inet routing_lab {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    iifname { "eth1", "eth2" } tcp dport 179 accept
    ip protocol icmp accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related counter accept
    iifname "eth1" oifname "eth2" ip saddr 10.111.1.0/24 ip daddr 10.112.1.0/24 tcp dport 8080 ct state new counter accept
    iifname "eth1" oifname "eth2" ip saddr 10.111.1.0/24 ip daddr 10.112.1.0/24 ip protocol icmp counter accept
    counter drop
  }
}
